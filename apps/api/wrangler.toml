name = "cash-flow-pulse-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 每日自动快照（UTC 15:00 = 日本时间 0:00）
[triggers]
crons = ["0 15 * * *"]

# ============================================================
# 前端静态资源（Workers Static Assets）
# ============================================================
# 这个 Worker 同时托管 SPA 和 API，取代原来的 Pages 项目：
#   - directory：Vite 产物，相对本文件 = apps/web/dist（部署前必须先构建，
#     所以 package.json 的 deploy 脚本会先跑 web build）
#   - not_found_handling=single-page-application：未命中资源的请求返回 index.html，
#     React Router 的 /incomes、/settings 等前端路由才能直接访问
#   - run_worker_first=["/api/*"]：必须显式声明，否则上一条会把 /api/* 也回退成
#     index.html，请求永远到不了 Hono（需要 wrangler >= 4.20）
# 静态资源请求不计入 Workers 请求计费。
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 自定义域名
# 迁移过渡期：先只接管 /api/*（前端仍由 Pages 提供），在 workers.dev 上验证完整站点后，
# 再按 docs/deployment.md「切换域名」一节改成：
#   [[routes]]
#   pattern = "cashflow.soniclab.cc"
#   custom_domain = true
[[routes]]
pattern = "cashflow.soniclab.cc/api/*"
zone_name = "soniclab.cc"

# D1 数据库绑定
# 首次部署前需要先创建 D1 实例：
#   wrangler d1 create cash-flow-pulse-db
# 然后将生成的 database_id 填到下方（脚本会自动回填）
[[d1_databases]]
binding = "DB"
database_name = "cash-flow-pulse-db"
database_id = "222e5633-5a2c-4af7-8efb-dbb0f7d5d6b5"

# 环境变量
# ALLOWED_ORIGIN 支持逗号分隔多域名
# 开发：http://localhost:5173 / http://localhost:8787
# 生产：https://cash.soniclab.cc / https://cash-flow-pulse.pages.dev / https://cashflow.soniclab.cc
# APP_URL：OAuth 登录成功后跳回的前端地址（本地开发可在 .dev.vars 覆盖为 http://localhost:5173）
[vars]
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:8787,https://cash.soniclab.cc,https://cash-flow-pulse.pages.dev,https://cashflow.soniclab.cc"
APP_URL = "https://cashflow.soniclab.cc"